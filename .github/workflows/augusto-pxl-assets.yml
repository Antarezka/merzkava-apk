name: Augusto PXL Asset Pipeline

on:
  push:
    branches:
      - "**"
    paths:
      - "pxl/**"
      - "scripts/pxl-build/**"
      - "public/assets/augusto-pxl/**"
      - "src/offline-game/augusto-pxl-runtime.ts"
      - "src/offline-game/**"
      - "src/main.ts"
      - "tests/**"
      - "package.json"
      - "docs/AUGUSTO_PXL_INTEGRATION_PLAN.md"
      - ".github/workflows/augusto-pxl-assets.yml"
  pull_request:
    paths:
      - "pxl/**"
      - "scripts/pxl-build/**"
      - "public/assets/augusto-pxl/**"
      - "src/offline-game/augusto-pxl-runtime.ts"
      - ".github/workflows/augusto-pxl-assets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Node.js toolchain
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - name: Install app dependencies
        run: npm install
      - name: Validate and export Augusto PXL source
        run: npm run pxl:build
      - name: Validate app TypeScript and production bundle
        run: npm run build
      - name: Run app regression tests
        run: npm test
      - name: Upload offline PXL package
        uses: actions/upload-artifact@v4
        with:
          name: augusto-pxl-offline-assets
          path: |
            public/assets/augusto-pxl/manifest.json
            public/assets/augusto-pxl/exports/**
            public/assets/augusto-pxl/licenses/**
          if-no-files-found: error
          retention-days: 90
