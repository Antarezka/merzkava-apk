name: Deploy Merzkava AI Gateway

on:
  workflow_dispatch:
  push:
    branches:
      - feature/opening-splash-screen
    paths:
      - "gateway/**"
      - ".github/workflows/deploy-gateway.yml"

permissions:
  contents: read

concurrency:
  group: merzkava-gateway-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy gateway
        run: npx wrangler@4 deploy --config gateway/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
