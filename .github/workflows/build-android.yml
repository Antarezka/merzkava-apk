name: Build Merzkava Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/opening-splash-screen
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - "vite.config.ts"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

concurrency:
  group: merzkava-android-build
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://zqkcmumxjmuoforgkeet.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_GM_GATEWAY_URL: https://merzkava-gateway.izerameztria.workers.dev

      - name: Create Android project if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Install APK on Android 14 emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            APK="android/app/build/outputs/apk/debug/app-debug.apk"
            echo "Attempting real Package Manager installation on Android API 34..."
            set +e
            adb install --no-streaming -r "$APK"
            INSTALL_EXIT=$?
            set -e
            if [ "$INSTALL_EXIT" -ne 0 ]; then
              echo "::error::Android Package Manager rejected the APK (adb install exit $INSTALL_EXIT)."
              echo "Relevant Package Manager / Package Installer logs:"
              adb logcat -d -v threadtime | grep -iE "PackageManager|PackageInstaller|installd|PackageParser|INSTALL_FAILED|parse error|parse failed" | tail -n 160 || true
              exit "$INSTALL_EXIT"
            fi
            echo "APK installation succeeded on Android API 34."
            adb shell pm path com.antarezka.merzkava
            adb shell dumpsys package com.antarezka.merzkava | grep -E "versionName|versionCode|primaryCpuAbi|secondaryCpuAbi" || true

      - name: Verify APK package, alignment, and signature
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          echo "APK file:"
          file "$APK"
          echo "APK size and checksum:"
          stat -c '%s bytes' "$APK"
          sha256sum "$APK"
          echo "APK manifest metadata:"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | head -n 20
          echo "APK alignment:"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          echo "APK signature:"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: merzkava-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
