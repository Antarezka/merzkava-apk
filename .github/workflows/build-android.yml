name: Build Merzkava Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/opening-splash-screen
      - feature/floating-mode-ledger
      - feature/archive-experience
    paths:
      - "src/**"
      - "public/**"
      - "native/**"
      - "scripts/**"
      - ".github/workflows/build-android.yml"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - "vite.config.ts"

permissions:
  contents: read

concurrency:
  group: merzkava-android-build
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://zqkcmumxjmuoforgkeet.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_GM_GATEWAY_URL: https://merzkava-gateway.izerameztria.workers.dev

      - name: Create Android project if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Install Merzkava Floating Mode native integration
        run: node scripts/patch-android.mjs

      - name: Configure permanent update signing and version
        env:
          MERZKAVA_KEYSTORE_BASE64: ${{ secrets.MERZKAVA_KEYSTORE_BASE64 }}
          MERZKAVA_KEYSTORE_PASSWORD: ${{ secrets.MERZKAVA_KEYSTORE_PASSWORD }}
          MERZKAVA_KEY_ALIAS: ${{ secrets.MERZKAVA_KEY_ALIAS }}
          MERZKAVA_KEY_PASSWORD: ${{ secrets.MERZKAVA_KEY_PASSWORD }}
          MERZKAVA_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          for name in MERZKAVA_KEYSTORE_BASE64 MERZKAVA_KEYSTORE_PASSWORD MERZKAVA_KEY_ALIAS MERZKAVA_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name. Add all four MERZKAVA signing secrets before building an update APK."
              exit 1
            fi
          done
          echo "$MERZKAVA_KEYSTORE_BASE64" | base64 --decode > android/merzkava-upload.jks
          test -s android/merzkava-upload.jks
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          s, n = re.subn(r'versionCode\s+\d+', 'versionCode Integer.parseInt(System.getenv("MERZKAVA_VERSION_CODE") ?: "1")', s, count=1)
          if n != 1:
              raise SystemExit("Could not locate app versionCode in android/app/build.gradle")
          s, n = re.subn(r'versionName\s+"[^"]+"', 'versionName "1.0." + (System.getenv("MERZKAVA_VERSION_CODE") ?: "1")', s, count=1)
          if n != 1:
              raise SystemExit("Could not locate app versionName in android/app/build.gradle")
          signing = '''
              signingConfigs {
                  merzkavaUpload {
                      storeFile file("${rootProject.projectDir}/merzkava-upload.jks")
                      storePassword System.getenv("MERZKAVA_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("MERZKAVA_KEY_ALIAS")
                      keyPassword System.getenv("MERZKAVA_KEY_PASSWORD")
                  }
              }
          '''
          s = s.replace("android {", "android {\n" + signing, 1)
          if re.search(r'buildTypes\s*\{', s) is None:
              raise SystemExit("Could not locate buildTypes in android/app/build.gradle")
          s, n = re.subn(r'(buildTypes\s*\{)', r'\1\n        debug { signingConfig signingConfigs.merzkavaUpload }', s, count=1)
          if n != 1:
              raise SystemExit("Could not configure debug signing")
          p.write_text(s)
          print("Configured stable Merzkava signing and versionCode", __import__("os").environ["MERZKAVA_VERSION_CODE"])
          PY

      - name: Build debug APK
        working-directory: android
        env:
          MERZKAVA_KEYSTORE_PASSWORD: ${{ secrets.MERZKAVA_KEYSTORE_PASSWORD }}
          MERZKAVA_KEY_ALIAS: ${{ secrets.MERZKAVA_KEY_ALIAS }}
          MERZKAVA_KEY_PASSWORD: ${{ secrets.MERZKAVA_KEY_PASSWORD }}
          MERZKAVA_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug

      - name: Verify APK package, version, alignment, and signature
        env:
          MERZKAVA_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -s "$APK"
          echo "APK file:"
          file "$APK"
          echo "APK size and checksum:"
          stat -c '%s bytes' "$APK"
          sha256sum "$APK"
          echo "APK manifest metadata:"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | head -n 20
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "versionCode='$MERZKAVA_VERSION_CODE'"
          echo "Verified versionCode: $MERZKAVA_VERSION_CODE"
          echo "APK alignment:"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          echo "APK signature:"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

      # Preserve a verified APK artifact even if the hosted emulator service is unstable.
      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: merzkava-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Install APK on Android 14 emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 900
          pre-emulator-launch-script: adb start-server
          disable-animations: true
          script: |
            set -eu
            APK="android/app/build/outputs/apk/debug/app-debug.apk"
            DIAG_DIR="$RUNNER_TEMP/merzkava-emulator-diagnostics"
            mkdir -p "$DIAG_DIR"
            FAILED=1

            collect_diagnostics() {
              echo "Collecting emulator diagnostics..."
              adb devices -l > "$DIAG_DIR/adb-devices.txt" 2>&1 || true
              adb shell getprop > "$DIAG_DIR/getprop.txt" 2>&1 || true
              adb shell pm list packages > "$DIAG_DIR/package-list.txt" 2>&1 || true
              adb shell dumpsys package > "$DIAG_DIR/package-manager.txt" 2>&1 || true
              adb shell df -h > "$DIAG_DIR/storage.txt" 2>&1 || true
              adb logcat -b all -d -t 6000 > "$DIAG_DIR/logcat.txt" 2>&1 || true
              adb shell dumpsys activity activities > "$DIAG_DIR/activities.txt" 2>&1 || true
            }

            echo "Waiting for Android device..."
            adb wait-for-device || { collect_diagnostics; exit 1; }
            test -s "$APK" || { echo "APK missing: $APK"; collect_diagnostics; exit 1; }

            echo "Waiting for Package Manager to become responsive..."
            PM_READY=0
            for attempt in $(seq 1 36); do
              BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [ "$BOOT" = "1" ] && adb shell pm list packages >/dev/null 2>&1; then
                PM_READY=1
                echo "Package Manager is responsive (attempt $attempt)."
                break
              fi
              sleep 5
            done

            if [ "$PM_READY" -ne 1 ]; then
              echo "Package Manager did not become responsive."
              collect_diagnostics
              exit 1
            fi

            for attempt in 1 2 3; do
              echo "APK install attempt $attempt/3..."
              if adb install -r "$APK" > "$DIAG_DIR/install-attempt-$attempt.txt" 2>&1; then
                cat "$DIAG_DIR/install-attempt-$attempt.txt"
                FAILED=0
                break
              fi
              cat "$DIAG_DIR/install-attempt-$attempt.txt"
              echo "Install attempt $attempt failed; checking Package Manager before retry."
              adb shell pm list packages >/dev/null 2>&1 || true
              adb reconnect device >/dev/null 2>&1 || true
              sleep 8
            done

            if [ "$FAILED" -ne 0 ]; then
              echo "Streaming install retries failed; trying non-streaming install once."
              if adb install --no-streaming -r "$APK" > "$DIAG_DIR/install-non-streaming.txt" 2>&1; then
                cat "$DIAG_DIR/install-non-streaming.txt"
                FAILED=0
              else
                cat "$DIAG_DIR/install-non-streaming.txt"
              fi
            fi

            if [ "$FAILED" -ne 0 ]; then
              echo "APK installation failed after retries."
              collect_diagnostics
              exit 1
            fi

            echo "Verifying installed package..."
            adb shell pm path com.antarezka.merzkava | tee "$DIAG_DIR/installed-package-path.txt"
            adb shell dumpsys package com.antarezka.merzkava | grep -E "versionName|versionCode|primaryCpuAbi|secondaryCpuAbi" > "$DIAG_DIR/installed-package-info.txt" || true

            echo "Launching Merzkava..."
            adb shell monkey -p com.antarezka.merzkava 1
            sleep 15
            if [ -z "$(adb shell pidof com.antarezka.merzkava 2>/dev/null | tr -d '\r')" ]; then
              echo "Merzkava process did not remain alive after launch."
              collect_diagnostics
              exit 1
            fi
            adb shell dumpsys activity activities > "$DIAG_DIR/activities.txt" 2>&1 || true
            if adb logcat -d -t 4000 | grep -E "FATAL EXCEPTION|Process: com.antarezka.merzkava" | grep -q "com.antarezka.merzkava"; then
              echo "App crash detected in emulator logcat."
              collect_diagnostics
              exit 1
            fi
            echo "Emulator install-and-launch smoke test passed."
            FAILED=0

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merzkava-emulator-diagnostics
          path: ${{ runner.temp }}/merzkava-emulator-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
