name: Build Merzkava Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/opening-splash-screen
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - "vite.config.ts"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

concurrency:
  group: merzkava-android-build
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://zqkcmumxjmuoforgkeet.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_GM_GATEWAY_URL: https://merzkava-gateway.izerameztria.workers.dev

      - name: Create Android project if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: merzkava-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
