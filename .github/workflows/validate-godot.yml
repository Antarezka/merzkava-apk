name: Godot Runtime Validation

on:
  push:
    branches:
      - migration/godot-offline-engine-2026-11-07
    paths:
      - "godot/**"
      - ".github/workflows/validate-godot.yml"
  pull_request:
    paths:
      - "godot/**"
      - ".github/workflows/validate-godot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Import, parse and launch Godot project headlessly
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download pinned Godot 4.7.2 stable
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            --output /tmp/godot.zip
          mkdir -p "${RUNNER_TEMP}/godot"
          unzip -q /tmp/godot.zip -d "${RUNNER_TEMP}/godot"
          GODOT_BIN="$(find "${RUNNER_TEMP}/godot" -maxdepth 2 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Import project and validate scripts
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path godot --editor --quit

      - name: Launch main scene headlessly
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path godot --quit-after 3

      - name: Record validated engine and source revision
        run: |
          echo "Godot: $("$GODOT_BIN" --version)"
          echo "Commit: $GITHUB_SHA"
